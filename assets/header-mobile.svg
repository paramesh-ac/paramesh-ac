<svg xmlns="http://www.w3.org/2000/svg" width="640" height="70" viewBox="0 0 640 70" role="img" aria-labelledby="title"><title id="title">Header</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111b2e"/><stop offset="1" stop-color="#080e1c"/></linearGradient><linearGradient id="accent" x2="1" y2="1"><stop stop-color="#79dfff"/><stop offset="1" stop-color="#27364f"/></linearGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif}.float{animation:float 6s ease-in-out infinite}.pulse{animation:pulse 4s ease-in-out infinite}.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 12s linear infinite}@keyframes float{50%{transform:translateY(-7px)}}@keyframes pulse{50%{opacity:.4}}@keyframes orbit{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.float,.pulse,.orbit{animation:none}}</style><rect x="1" y="1" width="638" height="68" rx="22" fill="url(#bg)" stroke="#26324a"/><text x="30" y="46" font-size="28" fill="#f3f7ff" font-weight="700" >BUILD. CONNECT. IMPROVE.</text></svg>
